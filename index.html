<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Nexora – Social Network Simulation System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f5f4fb;--c:#fff;--t:#1e1b3a;--m:#6b6890;--p:#6d5ef5;--p2:#4f8cff;--b:#e7e4f5;--h:#f0eefc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-t=dark]{--bg:#12112a;--c:#1c1b3a;--t:#ecebff;--m:#9a98c4;--b:#2c2a55;--h:#262450;color-scheme:dark}
*{box-sizing:border-box;margin:0;font-family:Inter,system-ui,"Segoe UI",sans-serif}body{background:var(--bg);color:var(--t);font-size:14px}
.app{display:grid;grid-template-columns:220px minmax(0,1fr) 280px;gap:18px;max-width:1380px;margin:auto;padding:16px}
.sb,.rs{position:sticky;top:16px;align-self:start;display:flex;flex-direction:column;gap:12px}
.card{background:var(--c);border:1px solid var(--b);border-radius:18px;padding:16px;margin-bottom:14px;animation:f .3s}@keyframes f{from{opacity:0;transform:translateY(6px)}}
.logo{font-weight:800;font-size:22px;background:linear-gradient(90deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent;padding:6px 10px}
.nv{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;cursor:pointer;color:var(--m);font-weight:600}.nv:hover{background:var(--h)}.nv.on{background:linear-gradient(90deg,var(--p),var(--p2));color:#fff}
.bd{background:#ef4565;color:#fff;border-radius:99px;padding:1px 7px;font-size:11px;margin-left:auto}
button,.btn{background:linear-gradient(90deg,var(--p),var(--p2));color:#fff;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;transition:.15s}button:hover{transform:translateY(-1px);opacity:.92}
button.g{background:var(--h);color:var(--t)}button.d{background:#ef4565}button.s{padding:4px 10px;font-size:12px}
input,textarea,select{width:100%;background:var(--bg);color:var(--t);border:1px solid var(--b);border-radius:10px;padding:10px;margin:4px 0}
.av{border-radius:50%;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.m{color:var(--m);font-size:12px}.w{flex-wrap:wrap}
.pi{width:100%;max-height:380px;object-fit:cover;border-radius:12px;margin-top:8px}.act{display:flex;gap:8px;margin-top:10px}
.cmt{background:var(--h);padding:8px 10px;border-radius:12px;margin-top:6px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.st{font-size:26px;font-weight:800;color:var(--p)}
.ch{height:240px;position:relative}table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:left;border-bottom:1px solid var(--b)}
.tabs{display:flex;gap:6px;margin-bottom:10px}#ts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:9}.tt{background:#1e1b3a;color:#fff;padding:10px 18px;border-radius:12px;margin-top:6px}.tt.err{background:#ef4565}
.au{max-width:420px;margin:6vh auto;padding:16px}canvas#cv{width:100%;height:520px;border-radius:14px;background:var(--bg);cursor:grab;touch-action:none}
@media(max-width:1000px){.app{grid-template-columns:1fr}.rs{display:none}.sb{position:static;flex-direction:row;overflow-x:auto}.nv{white-space:nowrap}.logo{display:none}}
</style></head><body><div id="app"></div><div id="ts"></div>
<script>
const K="nexora_db_v1",D=864e5,now=()=>Date.now(),$=s=>document.querySelector(s);
const e=s=>String(s??"").replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
const PAL=["#6d5ef5","#4f8cff","#f0568c","#18b99a","#f5a524","#9b5de5","#00bbf9","#ef476f","#06d6a0","#8d99ae"];
let db,me=null,view="feed",arg="",Q="",am="login",ch=[],tmp=null,F="all";
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,"0")).join("");
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(x){toast("Storage full – remove large images","err")}};
const nid=()=>db.n++,U=id=>db.users.find(u=>u.id==id),P=id=>db.posts.find(p=>p.id==id);
const ago=t=>{let s=(now()-t)/1e3;return s<60?"just now":s<3600?~~(s/60)+"m ago":s<86400?~~(s/3600)+"h ago":~~(s/86400)+"d ago"};
const av=(u,z=40)=>u.pic?`<img class=av style="width:${z}px;height:${z}px" src="${u.pic}">`:`<span class=av style="width:${z}px;height:${z}px;background:hsl(${u.id*47%360} 65% 55%);font-size:${z/2.6}px">${e(u.name.split(" ").map(w=>w[0]).slice(0,2).join(""))}</span>`;
const rel=(x,y)=>db.fr.find(r=>(r.a==x&&r.b==y)||(r.a==y&&r.b==x));
const st=(x,y)=>{const r=rel(x,y);return!r?"none":r.s=="f"?"friends":r.a==x?"sent":"recv"};
const fl=id=>db.fr.filter(r=>r.s=="f"&&(r.a==id||r.b==id)).map(r=>r.a==id?r.b:r.a);
const mut=(x,y)=>fl(x).filter(i=>fl(y).includes(i));
const note=(to,from,type,p)=>{if(to!=from)db.nt.push({id:nid(),to,from,type,p,ts:now(),r:0})};
const toast=(m,c="")=>{const d=document.createElement("div");d.className="tt "+c;d.textContent=m;$("#ts").append(d);setTimeout(()=>d.remove(),2600)};
const rs=(f,m,cb)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.72))};i.src=r.result};r.readAsDataURL(f)};
function stats(){const m={};db.users.forEach(u=>m[u.id]={u,deg:fl(u.id).length,lk:0,cm:0,act:0});
db.posts.forEach(p=>m[p.u]&&m[p.u].act++);
db.likes.forEach(l=>{const p=P(l.p);p&&m[p.u]&&m[p.u].lk++;m[l.u]&&m[l.u].act++});
db.cx.forEach(c=>{const p=P(c.p);p&&m[p.u]&&m[p.u].cm++;m[c.u]&&m[c.u].act++});
const v=Object.values(m),mx=k=>Math.max(1,...v.map(o=>o[k]));const a=mx("deg"),b=mx("lk"),c=mx("cm"),d=mx("act");
v.forEach(o=>o.sc=Math.round(100*(.4*o.deg/a+.25*o.lk/b+.2*o.cm/c+.15*o.act/d)));return v.sort((x,y)=>y.sc-x.sc)}
function detect(){const ids=db.users.map(u=>u.id),L={};ids.forEach(i=>L[i]=i);
for(let k=0;k<12;k++)ids.forEach(i=>{const c={};fl(i).forEach(j=>c[L[j]]=(c[L[j]]||0)+1);const s=Object.entries(c).sort((a,b)=>b[1]-a[1]||a[0]-b[0]);if(s.length)L[i]=+s[0][0]});
const g=[...new Set(Object.values(L))],mp={};g.forEach((x,i)=>mp[x]=i);ids.forEach(i=>L[i]=mp[L[i]]);return L}
async function seed(){const h=await sha("demo123"),ha=await sha("admin123");let s=7;const R=()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const N="Aarav Mehta,Priya Nair,Rohan Iyer,Ananya Rao,Karthik Subramanian,Meera Pillai,Vikram Singh,Sneha Kapoor,Arjun Das,Divya Menon,Isha Verma,Rahul Khanna,Lakshmi Narayan,Siddharth Jain,Neha Gupta,Farhan Ali,Tara Bose,Dev Patel,Kavya Reddy,Manoj Kumar".split(","),
B=["Software engineer. Coffee addict.","Designer chasing pixels.","Musician and playlist curator.","Traveller. 30 countries and counting."],
T=[["Just shipped a new feature – tests all green!","Hot take: readable code beats clever code.","Open source weekend, who is in?","Debugging at 2am again. Worth it."],["Minimal layouts are never really minimal.","New colour palette is finally done.","Sketching ideas on paper first always wins.","Typography makes or breaks a product."],["Discovered an amazing indie album today.","Live gig tonight, bring your friends!","Practising scales for an hour a day.","Lo-fi beats make coding sweeter."],["Sunrise from the mountain top. Unreal.","Street food tour in Chennai was epic.","Packing for the next adventure.","Slow travel is the best travel."]],
C=["Great post!","Totally agree with this.","Love it, thanks for sharing.","This made my day.","Well said!","Count me in!","Brilliant idea.","So true."];
db={n:1,users:[],fr:[],posts:[],likes:[],cx:[],nt:[],co:[],cu:[]};
db.users.push({id:nid(),name:"Platform Admin",un:"admin",em:"admin@nexora.app",pw:ha,bio:"Nexora administrator",role:"admin",on:1,ts:now()-30*D});
N.forEach((n,i)=>{const f=n.split(" ")[0].toLowerCase();db.users.push({id:nid(),name:n,un:f,em:f+"@nexora.app",pw:h,bio:B[~~(i/5)],role:"user",on:1,ts:now()-(30-i*1.4)*D,g:~~(i/5)})});
const us=db.users.slice(1);
for(let i=0;i<20;i++)for(let j=i+1;j<20;j++)if(~~(i/5)==~~(j/5)&&R()<.8)db.fr.push({a:us[i].id,b:us[j].id,s:"f"});
[[1,6],[4,11],[8,13],[12,17],[3,16],[2,9]].forEach(([i,j])=>db.fr.push({a:us[i].id,b:us[j].id,s:"f"}));
[15,11].forEach(i=>{db.fr.push({a:us[i].id,b:us[0].id,s:"p"});db.nt.push({id:nid(),to:us[0].id,from:us[i].id,type:"req",ts:now()-R()*D,r:0})});
["Code & Coffee","Design Studio","Music Lounge","Wanderers"].forEach((n,g)=>{const c={id:nid(),name:n,about:"A friendly community for "+n.toLowerCase()+" lovers.",by:us[g*5].id,ts:now()-20*D};db.co.push(c);us.filter(u=>u.g==g).forEach(u=>db.cu.push({c:c.id,u:u.id}));db.cu.push({c:c.id,u:us[(g*5+7)%20].id});db.posts.push({id:nid(),u:us[g*5].id,t:"Welcome to "+n+"! Introduce yourself below.",ts:now()-15*D,c:c.id})});
us.forEach((u,i)=>{for(let k=0;k<4;k++)if(R()<.85)db.posts.push({id:nid(),u:u.id,t:T[u.g][k],ts:now()-R()*29*D})});
db.posts.slice().forEach(p=>fl(p.u).forEach(f=>{if(R()<.5)db.likes.push({p:p.id,u:f,ts:Math.min(now(),p.ts+R()*2*D)});if(R()<.22)db.cx.push({id:nid(),p:p.id,u:f,t:C[~~(R()*8)],ts:Math.min(now(),p.ts+R()*D)})}));
db.likes.filter(l=>P(l.p).u==us[0].id).slice(0,3).forEach(l=>db.nt.push({id:nid(),to:us[0].id,from:l.u,type:"like",p:l.p,ts:l.ts,r:1}));save()}
const nav=[["feed","🏠","Home"],["profile","👤","My Profile"],["friends","👥","Friends"],["requests","➕","Requests"],["notifs","🔔","Notifications"],["comms","🏘","Communities"],["analytics","📊","Analytics"],["network","🕸","Network"],["settings","⚙","Settings"]];
const A={go(v,a=""){view=v;arg=a;render();scrollTo(0,0)},up(){save();render()},
async login(){const k=$("#lu").value.trim().toLowerCase(),u=db.users.find(u=>u.un==k||u.em==k);if(!u||u.pw!=await sha($("#lp").value))return toast("Invalid username or password","err");if(!u.on)return toast("This account is deactivated","err");me=u;localStorage.setItem("nx_s",u.id);view="feed";render()},
async reg(){const g=i=>$("#"+i).value.trim(),n=g("rn"),un=g("ru").toLowerCase(),em=g("re").toLowerCase(),pw=$("#rp").value;
if(n.length<2||!/^\w{3,20}$/.test(un)||!/^\S+@\S+\.\S+$/.test(em)||pw.length<6)return toast("Check fields: valid name, 3-20 char username, email, 6+ char password","err");
if(db.users.some(u=>u.un==un||u.em==em))return toast("Username or email already taken","err");
const u={id:nid(),name:n,un,em,pw:await sha(pw),bio:g("rb"),pic:tmp,role:"user",on:1,ts:now()};db.users.push(u);tmp=null;me=u;localStorage.setItem("nx_s",u.id);save();toast("Welcome to Nexora!");view="feed";render()},
async reset(){const u=db.users.find(u=>u.em==$("#fe").value.trim().toLowerCase());if(!u||$("#fp").value.length<6)return toast("Unknown email or password too short","err");u.pw=await sha($("#fp").value);save();am="login";render();toast("Password reset. Please log in.")},
out(){me=null;localStorage.removeItem("nx_s");render()},am(x){am=x;render()},
theme(){const d=document.documentElement;d.dataset.t=d.dataset.t=="dark"?"light":"dark";localStorage.setItem("nx_t",d.dataset.t);render()},
img(el){const f=el.files[0];if(f)rs(f,el.dataset.m|0||600,d=>{tmp=d;toast("Image attached")})},
post(c){const t=$("#pt").value.trim();if(!t&&!tmp)return toast("Write something or attach an image","err");db.posts.push({id:nid(),u:me.id,t,img:tmp,ts:now(),c:c||undefined});tmp=null;toast("Posted!");A.up()},
like(id){const i=db.likes.findIndex(l=>l.p==id&&l.u==me.id);if(i>=0)db.likes.splice(i,1);else{db.likes.push({p:id,u:me.id,ts:now()});note(P(id).u,me.id,"like",id)}A.up()},
cm(id){const v=$("#ci"+id).value.trim();if(!v)return toast("Write a comment first","err");db.cx.push({id:nid(),p:id,u:me.id,t:v,ts:now()});note(P(id).u,me.id,"comment",id);A.up()},
ecm(id){const c=db.cx.find(x=>x.id==id);if(c.u!=me.id)return;const v=prompt("Edit comment",c.t);if(v&&v.trim()){c.t=v.trim();A.up()}},
dcm(id){const c=db.cx.find(x=>x.id==id);if(c.u!=me.id&&me.role!="admin")return toast("Not allowed","err");db.cx=db.cx.filter(x=>x.id!=id);A.up()},
epost(id){const p=P(id);if(p.u!=me.id)return toast("You can only edit your own posts","err");const v=prompt("Edit post",p.t);if(v!==null){p.t=v.trim();A.up()}},
dpost(id){const p=P(id);if(p.u!=me.id&&me.role!="admin")return toast("You can only delete your own posts","err");if(!confirm("Delete this post?"))return;db.posts=db.posts.filter(x=>x.id!=id&&x.of!=id);db.likes=db.likes.filter(l=>l.p!=id);db.cx=db.cx.filter(c=>c.p!=id);toast("Post deleted");A.up()},
share(id){const p=P(id);db.posts.push({id:nid(),u:me.id,t:"",of:p.of||id,ts:now()});note(p.u,me.id,"share",id);toast("Shared with your friends");A.up()},
fr(id,op){const r=rel(me.id,id);if(op=="add"){if(r)return toast("Already connected or pending","err");db.fr.push({a:me.id,b:id,s:"p"});note(id,me.id,"req");toast("Friend request sent")}
else if(op=="acc"&&r&&r.b==me.id){r.s="f";note(id,me.id,"acc");toast("You are now friends")}else if(r){if(op=="rm"&&!confirm("Remove this friend?"))return;db.fr=db.fr.filter(x=>x!=r);toast(op=="rej"?"Request rejected":op=="can"?"Request cancelled":"Friend removed")}A.up()},
read(id){const n=db.nt.find(x=>x.id==id);n.r=1;A.up()},readAll(){db.nt.filter(n=>n.to==me.id).forEach(n=>n.r=1);A.up()},
sq(){Q=$("#gq").value.trim();A.go("search")},
prof(){me.name=$("#sn").value.trim()||me.name;me.bio=$("#sb").value.trim();if(tmp)me.pic=tmp;tmp=null;toast("Profile updated");A.up()},
cc(){const n=$("#cn").value.trim();if(n.length<3)return toast("Community name too short","err");if(db.co.some(c=>c.name.toLowerCase()==n.toLowerCase()))return toast("Name already exists","err");const c={id:nid(),name:n,about:$("#ca").value.trim()||"A new community.",by:me.id,ts:now()};db.co.push(c);db.cu.push({c:c.id,u:me.id});toast("Community created");A.up()},
jc(id){const i=db.cu.findIndex(x=>x.c==id&&x.u==me.id);if(i>=0)db.cu.splice(i,1);else db.cu.push({c:id,u:me.id});A.up()},
tog(id){const u=U(id);if(u.role=="admin")return toast("Cannot deactivate an admin","err");u.on=u.on?0:1;A.up()},
async add(){const un=$("#au").value.trim().toLowerCase(),n=$("#an").value.trim();if(!n||!/^\w{3,20}$/.test(un)||db.users.some(u=>u.un==un))return toast("Invalid or duplicate username","err");db.users.push({id:nid(),name:n,un,em:un+"@nexora.app",pw:await sha("demo123"),bio:"",role:"user",on:1,ts:now()});toast("User added (password: demo123)");A.up()},
rep(){const s=stats(),t=s[0];arg=`NEXORA PLATFORM REPORT – ${new Date().toDateString()}\nUsers: ${db.users.length}\nFriendships: ${db.fr.filter(r=>r.s=="f").length}\nPosts: ${db.posts.length}\nLikes: ${db.likes.length}\nComments: ${db.cx.length}\nCommunities: ${db.co.length}\nTop influencer: ${t.u.name} (score ${t.sc})`;render()},
rst(){if(confirm("Reset all demo data?")){localStorage.removeItem(K);location.reload()}}};
const post=p=>{const u=U(p.u),o=p.of&&P(p.of),ou=o&&U(o.u),B=o||p,lk=db.likes.filter(l=>l.p==p.id),cs=db.cx.filter(c=>c.p==p.id),sh=db.posts.filter(x=>x.of==p.id).length,li=lk.some(l=>l.u==me.id);
return`<div class=card><div class="row sp"><div class=row onclick="A.go('profile',${u.id})" style="cursor:pointer">${av(u,42)}<div><b>${e(u.name)}</b> <span class=m>@${e(u.un)}</span><div class=m>${ago(p.ts)}${p.of?" · shared":""}${p.c?" · in "+e((db.co.find(c=>c.id==p.c)||{}).name):""}</div></div></div>
${p.u==me.id?`<div class=row><button class="g s" onclick="A.epost(${p.id})">Edit</button><button class="d s" onclick="A.dpost(${p.id})">Delete</button></div>`:me.role=="admin"?`<button class="d s" onclick="A.dpost(${p.id})">Remove</button>`:""}</div>
<p style="margin-top:10px;white-space:pre-wrap">${e(p.t)}</p>${p.img?`<img class=pi src="${p.img}">`:""}
${o?`<div class=cmt><b>${e(ou.name)}</b> <span class=m>@${e(ou.un)}</span><p>${e(o.t)}</p>${o.img?`<img class=pi src="${o.img}">`:""}</div>`:""}
<div class=act><button class="${li?"":"g"} s" onclick="A.like(${p.id})">${li?"♥ Liked":"♡ Like"} · ${lk.length}</button><button class="g s" onclick="$('#ci${p.id}').focus()">💬 ${cs.length}</button><button class="g s" onclick="A.share(${p.id})">↗ Share · ${sh}</button></div>
${cs.map(c=>{const cu=U(c.u);return`<div class="cmt row sp"><div class=row>${av(cu,26)}<div><b>${e(cu.name)}</b> <span class=m>${ago(c.ts)}</span><br>${e(c.t)}</div></div><div>${c.u==me.id?`<button class="g s" onclick="A.ecm(${c.id})">Edit</button> `:""}${c.u==me.id||me.role=="admin"?`<button class="d s" onclick="A.dcm(${c.id})">✕</button>`:""}</div></div>`}).join("")}
<div class=row style="margin-top:8px"><input id=ci${p.id} placeholder="Write a comment…" onkeydown="event.key=='Enter'&&A.cm(${p.id})"><button onclick="A.cm(${p.id})">Send</button></div></div>`};
const fbtn=u=>{if(u.id==me.id)return"";const s=st(me.id,u.id);return s=="friends"?`<button class="g s" onclick="A.fr(${u.id},'rm')">✓ Friends</button>`:s=="sent"?`<button class="g s" onclick="A.fr(${u.id},'can')">Request Sent ✕</button>`:s=="recv"?`<button class=s onclick="A.fr(${u.id},'acc')">Accept</button><button class="g s" onclick="A.fr(${u.id},'rej')">Reject</button>`:`<button class=s onclick="A.fr(${u.id},'add')">+ Add</button>`};
const urow=u=>{const mu=u.id==me.id?0:mut(me.id,u.id).length;return`<div class="row sp" style="margin:8px 0"><div class=row style="cursor:pointer" onclick="A.go('profile',${u.id})">${av(u,38)}<div><b>${e(u.name)}</b><div class=m>@${e(u.un)}${mu?" · "+mu+" mutual":""}</div></div></div><div class=row>${fbtn(u)}</div></div>`};
const V={
feed(){const f=fl(me.id),ps=db.posts.filter(p=>!p.c&&(p.u==me.id||f.includes(p.u))).sort((a,b)=>b.ts-a.ts);
